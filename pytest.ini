[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_default_fixture_loop_scope = function

# Surface warnings we care about instead of burying them in the summary.
# An un-awaited coroutine is almost always a mock wired as async when the
# real call is sync, which silently disables the assertion it supports.
filterwarnings =
    error::RuntimeWarning
    ignore::DeprecationWarning:fastapi.*
